name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run lint
      run: npm run lint
      
    - name: Build frontend
      run: npm run build
      
    # Note: We omit "npm run test" here unless Vitest is actually configured with test cases.
    # We will just run the build step to ensure code compiles.

  test-db:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest
        
    - name: Verify Supabase configuration
      run: supabase status || echo "Supabase not started yet"
      
    # - name: Run DB Tests
    #   run: supabase test db
    # Commented out for now since it requires Docker and a local supabase start which can be heavy for simple CI. 
    # Can be enabled when fully ready for production.
